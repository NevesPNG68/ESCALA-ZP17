name: Atualizar escala ZP-17

on:
  schedule:
    # O workflow acorda diariamente; o script abaixo decide quando consultar a CPPR.
    # Isso permite respeitar o fim real de cada mês e compensar atrasos do GitHub.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-escala-zp17
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Aplicar regra de agendamento
        id: policy
        run: python SCRIPTS/verificar_agendamento.py
      - name: Consultar CPPR e reconstruir a base
        if: github.event_name == 'workflow_dispatch' || steps.policy.outputs.due == 'true'
        run: python SCRIPTS/atualizar_web.py
      - name: Validar planilha
        if: github.event_name == 'workflow_dispatch' || steps.policy.outputs.due == 'true'
        run: python SCRIPTS/validar_dados_2026.py
      - name: Publicar somente quando houver alteracao
        if: github.event_name == 'workflow_dispatch' || steps.policy.outputs.due == 'true'
        shell: bash
        run: |
          git add -f PLANILHA/Escala_ZP17_2026.xlsx PLANILHA/Escala_ZP17_2026.xlsx.parts2 APP/data/update-status.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao oficial encontrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza escala oficial ZP-17"
          git push
